<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="SHOPEDGE - Shop smart. Shop easy.">
<title>SHOPEDGE | Shop Smart. Shop Easy.</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fa;
  color:#111827;
}

header{
  background:#111827;
  color:white;
  position:sticky;
  top:0;
  z-index:1000;
  box-shadow:0 3px 15px rgba(0,0,0,.15);
}

.topbar{
  max-width:1100px;
  margin:auto;
  padding:14px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.logo{
  font-size:25px;
  font-weight:900;
  letter-spacing:-1px;
}

.logo span{
  color:#38bdf8;
}

.cart-btn{
  border:0;
  background:#38bdf8;
  color:#07111f;
  padding:10px 14px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.search-area{
  max-width:1100px;
  margin:auto;
  padding:0 16px 14px;
}

.search-area input{
  width:100%;
  padding:13px 15px;
  border:0;
  border-radius:10px;
  outline:none;
  font-size:15px;
}

.hero{
  background:linear-gradient(135deg,#111827,#1e3a8a);
  color:white;
  padding:55px 20px;
  text-align:center;
}

.hero h1{
  font-size:38px;
  margin-bottom:12px;
}

.hero p{
  font-size:17px;
  color:#dbeafe;
  margin-bottom:24px;
}

.shop-btn{
  display:inline-block;
  background:#38bdf8;
  color:#07111f;
  padding:13px 24px;
  border-radius:10px;
  text-decoration:none;
  font-weight:800;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:30px 16px;
}

.section-title{
  font-size:25px;
  margin-bottom:18px;
}

.categories{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-bottom:35px;
}

.category{
  background:white;
  padding:17px 8px;
  border-radius:12px;
  text-align:center;
  font-weight:bold;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
  cursor:pointer;
}

.category div{
  font-size:25px;
  margin-bottom:7px;
}

.products{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.product{
  background:white;
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
  position:relative;
}

.product-img{
  height:155px;
  background:#e5e7eb;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:55px;
}

.product-info{
  padding:14px;
}

.product h3{
  font-size:16px;
  margin-bottom:7px;
}

.rating{
  font-size:13px;
  margin-bottom:8px;
}

.price{
  font-size:20px;
  font-weight:900;
  margin-bottom:10px;
}

.old-price{
  font-size:13px;
  color:#9ca3af;
  text-decoration:line-through;
  margin-left:5px;
}

.add-btn{
  width:100%;
  padding:11px;
  border:0;
  border-radius:9px;
  background:#111827;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.wish{
  position:absolute;
  top:10px;
  right:10px;
  border:0;
  background:white;
  width:36px;
  height:36px;
  border-radius:50%;
  font-size:19px;
  cursor:pointer;
}

.deal{
  background:#dc2626;
  color:white;
  display:inline-block;
  padding:4px 7px;
  border-radius:5px;
  font-size:11px;
  font-weight:bold;
  margin-bottom:7px;
}

.features{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.feature{
  background:white;
  padding:20px 15px;
  border-radius:12px;
  text-align:center;
  box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.feature-icon{
  font-size:30px;
  margin-bottom:8px;
}

.policy{
  background:white;
  border-radius:15px;
  padding:22px;
  line-height:1.6;
}

.policy h3{
  margin:15px 0 5px;
}

footer{
  background:#111827;
  color:#d1d5db;
  text-align:center;
  padding:30px 16px;
  margin-top:20px;
}

footer strong{
  color:white
